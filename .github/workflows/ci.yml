name: CI

# Deployment is handled by Cloudflare Pages' git integration on push.
# This workflow only validates the build so breakage is caught before deploy.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Content integrity check
        run: python scripts/check.py

      - name: Build site
        run: |
          pip install -r requirements.txt
          python scripts/build.py
